<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Type Beat Store - Lil Trix Fuego</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
<!-- Basic styles -->
<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-color: #111;
  color: #fff;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #222;
  padding: 20px;
}
.logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 48px;
  color: #ff0055;
}
.nav {
  display: flex;
  gap: 15px;
}
.nav a {
  color: #fff;
  text-decoration: none;
  font-family: 'Bebas Neue', cursive;
}
.search-bar {
  padding: 10px;
  border-radius: 20px;
  border: none;
  font-size: 16px;
}
.content {
  padding: 20px;
}
.section {
  margin-bottom: 40px;
}
.section h2 {
  font-family: 'Bebas Neue', cursive;
  font-size: 36px;
  margin-bottom: 20px;
}
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.beat-card {
  background-color: #222;
  border-radius: 10px;
  overflow: hidden;
  width: 200px;
  transition: transform 0.2s;
}
.beat-card:hover {
  transform: scale(1.05);
}
.beat-image {
  width: 100%;
  height: auto;
}
.beat-info {
  padding: 10px;
  text-align: center;
}
.buy-btn {
  background-color: #ff0055;
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 10px;
}
.buy-btn:hover {
  background-color: #cc0044;
}
.footer {
  text-align: center;
  padding: 20px;
  background: #222;
  font-size: 14px;
  color: #777;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">Lil Trix Fuego</div>
  <div class="nav">
    <a href="#marketplace">Marketplace</a>
    <a href="#upload">Upload</a>
    <a href="#profile">Profile</a>
    <a href="#login">Login</a>
  </div>
</div>

<!-- Search Bar -->
<div class="content">
  <input type="text" class="search-bar" placeholder="Search beats..." />
</div>

<!-- Marketplace Section -->
<div class="section" id="marketplace">
  <h2>Beat Marketplace</h2>
  <div class="gallery" id="beatsContainer">
    <!-- Beats will load here dynamically -->
  </div>
</div>

<!-- Upload Section -->
<div class="section" id="upload">
  <h2>Upload Your Beat</h2>
  <form id="uploadForm">
    <input type="file" accept="image/*" id="beatImage" required /><br /><br />
    <input type="text" placeholder="Beat Title" id="beatTitle" required /><br /><br />
    <input type="file" accept="audio/*" id="beatAudio" required /><br /><br />
    <button type="submit">Upload Beat</button>
  </form>
</div>

<!-- Profile (Placeholder) -->
<div class="section" id="profile">
  <h2>Your Profile</h2>
  <p>Login to manage your beats and purchases.</p>
</div>

<!-- Footer -->
<div class="footer">
  &copy; 2024 Lil Trix Fuego. All rights reserved.
</div>

<!-- Scripts -->
<script>
// Example data array
const beats = [
  {
    title: "Sample Beat 1",
    image: "https://via.placeholder.com/200x200.png?text=Beat+1",
    audio: "#"
  },
  {
    title: "Sample Beat 2",
    image: "https://via.placeholder.com/200x200.png?text=Beat+2",
    audio: "#"
  }
];

const container = document.getElementById('beatsContainer');

function loadBeats() {
  container.innerHTML = '';
  beats.forEach((beat, index) => {
    const card = document.createElement('div');
    card.className = 'beat-card';
    card.innerHTML = `
      <img src="${beat.image}" class="beat-image" />
      <div class="beat-info">
        <h3>${beat.title}</h3>
        <button class="buy-btn" onclick="purchaseBeat('${beat.title}')">Buy for $10</button>
      </div>
    `;
    container.appendChild(card);
  });
}

loadBeats();

document.getElementById('uploadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const imageFile = document.getElementById('beatImage').files[0];
  const audioFile = document.getElementById('beatAudio').files[0];
  const title = document.getElementById('beatTitle').value.trim();

  if (imageFile && audioFile && title) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const newBeat = {
        title: title,
        image: 'https://via.placeholder.com/200x200.png?text=New+Beat', // Replace with actual uploaded image
        audio: '#' // Replace with actual uploaded audio
      };
      beats.push(newBeat);
      loadBeats();
    };
    reader.readAsDataURL(imageFile);
  } else {
    alert('Please fill all fields and upload files.');
  }
});

function purchaseBeat(title) {
  alert('Proceed to payment for ' + title + ' (Implement payment gateway)');
}
</script>
</body>
</html>
