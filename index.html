<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Type Beat Store</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
  }
  .beats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .beat-card {
    background: #f9f9f9;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .beat-card img {
    width: 100%;
    border-radius: 8px;
  }
  .beat-title {
    font-size: 1.2em;
    margin: 10px 0;
  }
  .price {
    font-weight: bold;
    margin-bottom: 10px;
  }
  .buy-button {
    background-color: #0070ba;
    color: #fff;
    padding: 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    font-size: 1em;
  }
  .buy-button:hover {
    background-color: #005fa3;
  }
</style>
</head>
<body>

<h1>My Type Beat Store</h1>

<div class="beats-grid" id="beatsContainer">
  <!-- Beat cards will go here -->
</div>

<script>
  // Example list of beats
  const beats = [
    {
      title: "Chill Lo-Fi Beat",
      image: "https://via.placeholder.com/300x200?text=Beat+1",
      price: "29.99",
      url: "https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=YOUR_BUTTON_ID_1"
    },
    {
      title: "Trap Banger",
      image: "https://via.placeholder.com/300x200?text=Beat+2",
      price: "39.99",
      url: "https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=YOUR_BUTTON_ID_2"
    }
    // Add more beats here
  ];

  const container = document.getElementById('beatsContainer');

  beats.forEach(beat => {
    const card = document.createElement('div');
    card.className = 'beat-card';

    card.innerHTML = `
      <img src="${beat.image}" alt="${beat.title}">
      <div class="beat-title">${beat.title}</div>
      <div class="price">$${beat.price}</div>
      <a href="${beat.url}" target="_blank">
        <button class="buy-button">Buy Now</button>
      </a>
    `;

    container.appendChild(card);
  });
</script>

</body>
</html>
