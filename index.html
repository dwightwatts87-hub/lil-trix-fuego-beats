<!-- Upload Form -->
<h2>Upload Your Beat</h2>
<form id="uploadBeatForm">
  <input type="text" placeholder="Beat Title" id="beatTitle" required /><br /><br />
  <input type="file" accept="audio/*" id="beatFile" required /><br /><br />
  <button type="submit">Upload Beat</button>
</form>

<!-- Beat List -->
<h2>Your Beats</h2>
<div id="beatsList"></div>

<script>
// Array to store beats
const beats = [];

document.getElementById('uploadBeatForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const title = document.getElementById('beatTitle').value.trim();
  const file = document.getElementById('beatFile').files[0];

  if (file && title) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const beat = {
        title: title,
        url: e.target.result
      };
      beats.push(beat);
      displayBeats();
    };
    reader.readAsDataURL(file);
  } else {
    alert('Please enter a title and select a file.');
  }
});

function displayBeats() {
  const container = document.getElementById('beatsList');
  container.innerHTML = '';
  beats.forEach((beat, index) => {
    const beatDiv = document.createElement('div');
    beatDiv.innerHTML = `
      <h4>${beat.title}</h4>
      <audio controls src="${beat.url}"></audio><br />
      <a href="${beat.url}" download="${beat.title}.mp3">Download</a>
      <hr />
    `;
    container.appendChild(beatDiv);
  });
}
</script>
